services:
  - type: web
    name: devcoach-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devcoach-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: devcoach-db
    databaseName: devcoach
    user: devcoach
    plan: free