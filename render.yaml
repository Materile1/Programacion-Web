services:
  - type: web
    name: devcoach-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devcoach-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_API_URL
        value: /api
      - key: CORS_ORIGINS
        value: https://devcoach-api-4gri.onrender.com

databases:
  - name: devcoach-db
    databaseName: devcoach
    user: devcoach
    plan: free