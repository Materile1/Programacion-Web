services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devcoach
      POSTGRES_USER: devcoach
      POSTGRES_PASSWORD: devcoach
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devcoach -d devcoach"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://devcoach:devcoach@db:5432/devcoach
      JWT_SECRET: local-compose-secret-change-me
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api
volumes:
  postgres_data:
